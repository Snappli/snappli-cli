version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production
    # zod sigue la versión del backend (src/shared se copia con sync:shared).
    ignore:
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # Los paquetes admiten Node >= 20: los tipos no pueden ofrecer APIs de un Node más nuevo.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
