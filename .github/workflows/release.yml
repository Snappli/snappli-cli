name: Release

# Publica @snappli/sdk y @snappli/cli en npm con Changesets y provenance. Queda apagado hasta que
# el repo tenga la variable RELEASE_ENABLED=true y el secreto NPM_TOKEN (token de automatización de
# la organización @snappli en npm, con 2FA obligatorio).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Versionar y publicar
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write # provenance de npm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Con changesets pendientes abre el PR "Version packages"; al integrarlo, publica.
      - uses: changesets/action@v2.1.2
        # v2: el token de GitHub va en github-token (por defecto el del workflow) y los commits y
        # tags se suben con la API de GitHub.
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
