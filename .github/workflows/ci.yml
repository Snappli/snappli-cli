name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, tests y ejemplos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        if: runner.os == 'Linux'
        run: pnpm exec biome ci .

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Los ejemplos se prueban contra el CLI recién construido.
      - run: pnpm test:examples

      - name: Empaquetar
        run: |
          mkdir tarballs
          (cd packages/sdk && pnpm pack --pack-destination ../../tarballs)
          (cd packages/cli && pnpm pack --pack-destination ../../tarballs)
        shell: bash

      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: tarballs
          path: tarballs/*.tgz

  # Los paquetes publicados prometen Node ≥ 20: se instalan los tarballs con npm y se prueban.
  smoke:
    name: Paquetes en Node ${{ matrix.node }} (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: tarballs
          path: tarballs

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: node scripts/smoke.mjs --tarballs tarballs

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
